# 本番用 Nginx 設定。
# 静的 SPA を配信しつつ、/api と /cable をバックエンドへプロキシして
# フロントと API を同一オリジン扱いにする(httpOnly セッションCookie を素直に扱うため)。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker の埋め込み DNS(127.0.0.11)でサービス名をリクエスト時に解決する。
    # upstream ブロックだと nginx 起動時にサービス名を解決できず起動失敗するため、
    # resolver + 変数付き proxy_pass でランタイム解決にする。
    resolver 127.0.0.11 valid=10s;

    # 静的アセットは長期キャッシュ(ハッシュ付きファイル名のため安全)。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API はバックエンド(Compose のサービス名 backend)へプロキシ。
    location /api/ {
        set $backend_host backend;
        proxy_pass http://$backend_host:3000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Action Cable(WebSocket)はアップグレードヘッダ付きでプロキシ。
    location /cable {
        set $backend_host backend;
        proxy_pass http://$backend_host:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # SPA フォールバック: 直接アクセスやリロードでも 404 にしない。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
